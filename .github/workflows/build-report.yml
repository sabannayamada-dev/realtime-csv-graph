name: Build experiment report

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Repository-relative path to the pipeline JSON
        required: true
        default: examples/pipeline_config.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build graphs and report
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: python -m experiment_report_pipeline.cli "$CONFIG_PATH" --output-dir generated-report
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-report
          path: generated-report/
          if-no-files-found: error
